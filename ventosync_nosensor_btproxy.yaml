# File:        ventosync_nosensor_btproxy.yaml
# Description: EXPERIMENTAL – PCB v1.0 variant without climate/radar sensors
#              (as ventosync_nosensor.yaml) plus the Home Assistant Bluetooth
#              proxy (packages/integration/bluetooth_proxy.yaml, off by default).
#              Uses its own partition table: the FIRST flash must be done over
#              USB (factory image); Wi-Fi and the floor / room / device ID must
#              be configured again afterwards. Afterwards OTA works as usual.
#              See documentation/en/en_bluetooth-proxy.md.
# Author:      Thomas Engeroff
# Created:     2026-10-02
# Modified:    2026-10-02
# ==========================================================================

substitutions:
  hide_climate_sensors: "true"
  hide_ntc_sensors: "true"
  firmware_variant: "ventosync-nosensor-btproxy"

esphome:
  build_flags:
      - "-DVENTOSYNC_NO_SCD41"
      - "-DVENTOSYNC_NO_BME680"
      - "-DVENTOSYNC_NO_RADAR"

packages:
  base: !include packages/base/ventosync_base.yaml
  mock_scd41: !include packages/sensors/mock_scd41.yaml
  mock_bme680: !include packages/sensors/mock_bme680.yaml
  mock_radar: !include packages/sensors/mock_radar.yaml
  bluetooth_proxy: !include packages/integration/bluetooth_proxy.yaml
