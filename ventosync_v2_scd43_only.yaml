# File:        ventosync_v2_scd43_only.yaml
# Description: PCB v2.0 (ESP32-C6-MINI-1U-H4) variant for devices with the SCD43
#              CO2 sensor board at H2 only. Same features as
#              ventosync_scd43_only.yaml (PCB v1.0).
#              Controls fan, clusters via ESP-NOW, and integrates with HA.
#              OTA manifest: manifest-${firmware_variant}.json (never offered to v1).
# Author:      Thomas Engeroff
# Created:     2026-10-16
# Modified:    2026-10-26
# ==========================================================================

substitutions:
  hide_climate_sensors: "false"
  firmware_variant: "ventosync-v2-scd43-only"

esphome:
  build_flags:
      - "-DVENTOSYNC_NO_RADAR"

packages:
  base: !include packages/base/ventosync_base_v2.yaml
  # SCD43 board at H2 (ESPHome scd4x platform; IDs historically scd41_*).
  scd41: !include packages/sensors/sensor_SCD41.yaml
  mock_radar: !include packages/sensors/mock_radar.yaml
