# File:        ventosync_sgp41.yaml
# Description: PCB v1.0 (Seeed XIAO ESP32-C6) variant for devices with the
#              SGP41 + SHT45 VOC sensor board at H2 (instead of the SCD43 board).
#              Same features as ventosync_v2_sgp41.yaml (PCB v2.0).
#              SHT45 → room temperature / humidity, SGP41 VOC index → CO2
#              equivalent for Smart-Automatik (packages/sensors/sensor_SGP41_SHT45.yaml).
#              Controls fan, clusters via ESP-NOW, and integrates with HA.
# Author:      Thomas Engeroff
# Created:     2026-10-15
# Modified:    2026-10-26
# ==========================================================================

substitutions:
  hide_climate_sensors: "false"
  firmware_variant: "ventosync-sgp41"

esphome:
  build_flags:
      - "-DVENTOSYNC_NO_SCD41"
      - "-DVENTOSYNC_NO_RADAR"

packages:
  base: !include packages/base/ventosync_base.yaml
  # The SGP41/SHT45 package extends the SCD41 mock (room climate) and
  # voc_co2eq (sensors_climate.yaml) — keep the mock in this variant.
  mock_scd41: !include packages/sensors/mock_scd41.yaml
  sgp41_sht45: !include packages/sensors/sensor_SGP41_SHT45.yaml
  mock_radar: !include packages/sensors/mock_radar.yaml
