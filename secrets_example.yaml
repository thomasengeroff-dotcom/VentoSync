# Your Wi-Fi SSID and password
wifi_ssid: "DEIN_WLAN_NAME"
wifi_password: "DEIN_WLAN_PASSWORT"
appw: "FALLBACK_HOTSPOT_PASSWORT" # fallback hotspot pwd (captive portal) in case wifi connection fails

# internal webserver with password protection
webuser: "DEIN_WEBSERVER_USER"
webpw: "DEIN_WEBSERVER_PASSWORT"

# API encryption key (32 bytes, base64). Also authenticates OTA uploads
# (ota: encryption: in esp32c6_common.yaml) — use the same key on every device
# and as the GitHub repository secret API_ENCRYPTION_KEY. Generate one with:
#   python3 -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
api_encryption_key: "MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="

# --- MQTT Integration (optional) ---
# Only required if you enable packages/integration/mqtt.yaml.
# See documentation/en/mqtt-integration.md for setup instructions.
# mqtt_broker: "192.168.1.100"
# mqtt_port: "1883"
# mqtt_username: "YOUR_MQTT_USERNAME"
# mqtt_password: "YOUR_MQTT_PASSWORD"
