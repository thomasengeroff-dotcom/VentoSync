name: ESPHome Config Lint

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# Keep in sync with ESPHOME_VERSION in build.yaml and upload_all.sh.
env:
  ESPHOME_VERSION: "2026.10.0"

jobs:
  lint:
    name: Validate YAML Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Docs-only changes skip the remaining steps (the job still reports
      # success, so a required check never stays pending).
      - name: Detect firmware changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/detect_changes.py

      # Variant list, CLAUDE.md variant table and YAML / C++ defaults must
      # agree — pure Python, runs on every change (also docs-only, since the
      # variant table lives in CLAUDE.md).
      - name: Check variant list and defaults
        run: python3 .github/scripts/ci_config.py check

      # dashboard.css is generated from the classes in dashboard.html and
      # inlined into the firmware; it must be regenerated with every class change.
      - name: Check dashboard stylesheet
        if: steps.changes.outputs.firmware == 'true'
        run: components/wrg_dashboard/tailwind/build_css.sh --check

      - name: Create dummy secrets.yaml
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cp secrets_example.yaml secrets.yaml
          # MQTT secrets are commented out in the example (optional package)
          printf 'mqtt_broker: "127.0.0.1"\nmqtt_port: "1883"\nmqtt_username: "ci_dummy"\nmqtt_password: "ci_dummy"\n' >> secrets.yaml

      - name: Set up Python
        if: steps.changes.outputs.firmware == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ESPHome
        if: steps.changes.outputs.firmware == 'true'
        run: pip install "esphome==${ESPHOME_VERSION}"

      # All variants (.github/variants.json) are validated here on every PR —
      # the firmware build of a PR only compiles the "pr": true variants of
      # variants.json (full, v2-sgp41), the others after the merge.
      - name: Verify Configuration (all variants)
        if: steps.changes.outputs.firmware == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_config.py generate
          for f in $(python3 .github/scripts/ci_config.py list); do
            echo "::group::esphome config $f"
            esphome config "$f" > /dev/null
            echo "::endgroup::"
            echo "✅ $f"
          done
