name: "CodeQL Security Scan"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "30 2 * * 0" # Jeden Sonntag Nacht

jobs:
  analyze:
    name: Analyze C/C++ Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Docs-only changes skip the remaining steps (the job still reports
      # success, so a required check never stays pending).
      - name: Detect firmware changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/detect_changes.py

      - name: Initialize CodeQL
        if: steps.changes.outputs.firmware == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          # Extra Sicherheitsscans aktivieren
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        if: steps.changes.outputs.firmware == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
