# ---------------------------------------------------------
# SENSORS CONFIGURATION
# ---------------------------------------------------------

sensor:
  # ---------------------------------------------------------
  # VOC-BASED CO2 EQUIVALENT (placeholder)
  # ---------------------------------------------------------
  # NaN unless the SGP41 + SHT45 board package extends it
  # (sensor_SGP41_SHT45.yaml, VentilationLogic::voc_index_to_co2eq()).
  - platform: template
    id: voc_co2eq
    name: "VOC CO2-Äquivalent (Mock)"
    unit_of_measurement: "ppm"
    internal: true
    lambda: 'return NAN;'

  # ---------------------------------------------------------
  # EFFECTIVE CO2 SENSOR (Unified Fallback)
  # ---------------------------------------------------------
  - platform: template
    name: "Effektiver CO2 Wert"
    id: effective_co2
    internal: ${hide_climate_sensors}
    unit_of_measurement: "ppm"
    device_class: "carbon_dioxide"
    state_class: "measurement"
    icon: "mdi:molecule-co2"
    update_interval: 30s
    lambda: |-
      static uint32_t last_valid_sensor_ms = millis();
      // Logged once per stale phase: variants without a CO2 source
      // (nosensor, NTConly, radar_only) are stale for good.
      static bool stale_logged = false;
      float co2 = id(scd41_co2).state;
      if (std::isnan(co2)) co2 = id(voc_co2eq).state;
      if (!std::isnan(co2)) {
        last_valid_sensor_ms = millis();
        if (stale_logged) {
          ESP_LOGI("co2", "CO2 value available again.");
          stale_logged = false;
        }
        return co2;
      }
      // Both sensors NaN — hold last value for up to 5 minutes, then publish NaN
      // to signal PID that input is stale. Auto mode handles NaN gracefully.
      if (millis() - last_valid_sensor_ms > 300000) {
        if (!stale_logged) {
          ESP_LOGW("co2", "CO2 staleness timeout (>5min). Publishing NaN.");
          stale_logged = true;
        }
        return NAN;
      }
      return id(effective_co2).state;

# ---------------------------------------------------------
# TEXT SENSORS (Status & Classification)
# ---------------------------------------------------------
text_sensor:
  # Human-readable CO2 classification based on effective value
  - platform: template
    name: "CO2 Bewertung"
    id: effective_co2_bewertung
    internal: ${hide_climate_sensors}
    icon: "mdi:circle-slice-8"
    lambda: |-
      return get_co2_classification(id(effective_co2).state);

  # Human-readable info about which sensor is used for WRG efficiency
  - platform: template
    name: "WRG Referenz-Messpunkt"
    id: wrg_reference_sensor
    internal: ${hide_ntc_sensors}
    icon: "mdi:target-variant"
    update_interval: 60s
    lambda: |-
      return std::string("NTC Sensoren");

