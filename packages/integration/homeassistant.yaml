sensor:
  # Home Assistant Data (Automation): 
  # Entity filled with data from Home Assistant. 
  # Must be configured as described in readme.md
  - platform: homeassistant
    name: "Außenluftfeuchtigkeit"
    id: outdoor_humidity
    entity_id: sensor.outdoor_humidity
    internal: true

binary_sensor:
  # Summer mode gate for automatic summer cooling.
  # Provided by HA template: season (April-October) AND outdoor temp > 18°C.
  # When unavailable (HA offline), defaults to false → heat recovery stays active (safe).
  - platform: homeassistant
    name: "Sommerbetrieb"
    id: sommerbetrieb
    entity_id: binary_sensor.sommerbetrieb
    internal: true

  # Window Guard (Fenstersperre) - HA State
  - platform: homeassistant
    name: "Fenstersperre"
    id: window_locked
    entity_id: ${window_sensor_id}
    internal: true
    
  # Smart Climate Control (Klima-Koordination) - AC state last pushed by
  # Home Assistant via the API action "set_ac_active" (below). Diagnostic
  # only; the coordinator also honours the AC state shared by room peers.
  # Expires after 15 min without a push (fail-safe: never throttle blindly).
  - platform: template
    name: "Klima aktiv (HA-Signal)"
    id: hvac_ac_active
    icon: "mdi:air-conditioner"
    device_class: running
    entity_category: diagnostic

  # Vacation Mode (Urlaubsmodus) - HA State
  - platform: homeassistant
    name: "Urlaubsmodus Sensor"
    id: vacation_mode_ha
    entity_id: ${vacation_sensor_id}
    internal: true
    on_press:
      - script.execute: handle_vacation_mode_on
    on_release:
      - script.execute: handle_vacation_mode_off

# ---------------------------------------------------------
# API ACTIONS (called by Home Assistant)
# ---------------------------------------------------------
# Merged into the api: block of esp32c6_common.yaml / wifi_ota.yaml.
api:
  actions:
    # Smart Climate Control: Home Assistant pushes the room AC state.
    # HA service: esphome.<device_name>_set_ac_active  (data: active: true/false)
    # Call it for at least one device of the room (ideally all) on every AC
    # state change and every 5 min (state expires after 15 min).
    - action: set_ac_active
      variables:
        active: bool
      then:
        - lambda: "hvac_on_ha_ac_state(active);"
