# File:        hardware_io_mcp23017.yaml
# Description: PCB v1.0 only — MCP23017 I/O expander (front panel buttons on
#              GPA0-GPA2) and its reset line on GPIO2. Included by
#              packages/board/pcb_v1.yaml. PCB v2.0 has no MCP23017: the
#              buttons sit on native GPIOs and GPIO2 is BTN_PWR.
# Author:      Thomas Engeroff
# Created:     2026-03-07
# Modified:    2026-10-01
# ==========================================================================
# ---------------------------------------------------------
# MCP23017 I/O EXPANDER
# ---------------------------------------------------------
mcp23017:
  - id: mcp23017_hub
    address: 0x20

switch:
  # MCP23017 Reset (Active Low)
  # This switch keeps the MCP23017 out of reset state
  - platform: gpio
    pin:
      number: GPIO2
      mode:
        output: true
        pullup: false   # External 10kΩ pull-up to 3.3V required on PCB
    name: "MCP23017 Reset"
    id: mcp23017_reset
    restore_mode: ALWAYS_ON
    internal: true
    # WARNING: GPIO2 is LOW during ESP32 boot sequence.
    # Hardware pull-up resistor (10kΩ) on RESET line is mandatory and installed on PCB.
