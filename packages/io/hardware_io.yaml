# File:        hardware_io.yaml
# Description: Hardware I/O shared by PCB v1.0 and v2.0: I2C bus, PCA9685 LED
#              driver, PCA9685 OE and the LD2450 UART. Identical GPIOs on both
#              boards. PCB v1 adds the MCP23017 in hardware_io_mcp23017.yaml.
# Author:      Thomas Engeroff
# Created:     2026-03-07
# Modified:    2026-10-01
# ==========================================================================
# ---------------------------------------------------------
# I2C BUS CONFIGURATION
# ---------------------------------------------------------
i2c:
  sda: GPIO22 # v1: XIAO D4 · v2: module pin 28 (IO22)
  scl: GPIO23 # v1: XIAO D5 · v2: module pin 29 (IO23)
  scan: false # Disable after hardware is verified
  id: bus_a
  frequency: 400kHz     # Industrial standard for faster transactions
  timeout: 10ms         # Sufficient for 400kHz with radio interrupt margin
  # If 10ms still causes timeouts, investigate I2C bus quality
  # (pull-up resistor values, wire length, capacitance)
  # pullup: true        # Usually not necessary as internal pullups are present

# ---------------------------------------------------------
# PCA9685 I/O EXPANDER (LED Driver)
# ---------------------------------------------------------
pca9685:
  - id: pwm_hub
    frequency: 1000Hz
    address: 0x40

# ---------------------------------------------------------
# PCA9685 OUTPUTS (LEDs) & GPIO OUTPUTS
# ---------------------------------------------------------
output:
  # --- LEDS Port A (Channels 0-11) ---
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 8 # LED_PWRV
    id: out_led_pwr
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 7 # LED_MSTV
    id: out_led_master

  # Level LEDs
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 1 # LED_L1V
    id: out_led_l1
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 9 # LED_L2V
    id: out_led_l2
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 3 # LED_L3V
    id: out_led_l3
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 11 # LED_L4V
    id: out_led_l4
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 5 # LED_L5V
    id: out_led_l5

  # Mode LED WRG
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 13 # LED_WRGV
    id: out_led_wrg

  # --- LEDS Port B ---
  # Mode LED Ventilation
  - platform: pca9685
    pca9685_id: pwm_hub
    channel: 15 # LED_VENV
    id: out_led_vent

switch:
  # PROBLEM:
  # PCA9685 OE (Output Enable) is Active Low.
  # inverted: true means ESPHome "ON" = GPIO LOW = LEDs enabled.
  # restore_mode: ALWAYS_ON means LEDs turn on immediately at boot,
  # BEFORE the PCA9685 registers are initialized with correct PWM values.
  # This can cause all LEDs to flash at full brightness briefly on every boot.
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    name: "PCA9685 Output Enable"
    id: pca9685_oe
    restore_mode: ALWAYS_OFF  # LEDs off until explicitly enabled after init
    internal: true

# ---------------------------------------------------------
# UART FOR HLK-LD2450 RADAR
# ---------------------------------------------------------
uart:
  - id: uart_ld2450
    tx_pin: GPIO16 # TXD0 (v1: XIAO D7) → LD2450 RX pin
    rx_pin: GPIO17 # RXD0 (v1: XIAO D6) → LD2450 TX pin
    baud_rate: 256000
    parity: NONE
    stop_bits: 1
